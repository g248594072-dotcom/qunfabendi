# 放到服务器：/etc/nginx/sites-available/fb-broadcast
# 启用：ln -s /etc/nginx/sites-available/fb-broadcast /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# 当前按公网 IP 配置；有域名时把下面 server_name 改成你的域名即可。
# 例：server_name 107.175.246.246 fb.yourdomain.com;

upstream fb_ui {
    server 127.0.0.1:3789;
}

upstream fb_novnc {
    server 127.0.0.1:6080;
}

server {
    listen 80;
    listen [::]:80;
    server_name 107.175.246.246;

    # ---- 主控制台 + 登录助手 ----
    location / {
        proxy_pass http://fb_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 220m;
    }

    # ---- 远程浏览器（noVNC）----
    location /novnc/ {
        proxy_pass http://fb_novnc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # noVNC 默认 WebSocket 路径
    location /websockify {
        proxy_pass http://fb_novnc/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
